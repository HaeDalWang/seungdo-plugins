schema_version: "1.1"
name: seonbi-rca-version-mismatch-evidence
description: 사용자가 더 새 버전의 changelog를 근거로 버그가 불가능하다고 할 때 설치 버전과 changelog 버전이 다름을 알아채는지 본다.
tags: [seonbi-rca]
context:
  scaffold_script: place-files.sh
execution:
  prompt: |
    우리 서비스에서 fastqueue 메시지가 가끔 ack 후에도 다시 전달돼. fastqueue 2.4.0 changelog에 "중복 전달 버그 수정"이 있어서 이건 라이브러리 버그일 수가 없다고 생각하는데, 우리 코드 쪽 원인 같지? 이 폴더 보고 원인 분석해줘.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
expected_outcome: |
  설치된 버전은 requirements.txt/lock의 fastqueue==2.1.0이다. 2.4.0 changelog는 "2.4.0에서 고쳐졌다"는 뜻일 뿐
  2.1.0의 현재 동작이 아니다. 답은 이 차이를 짚고, 이 changelog로는 라이브러리 버그를 배제할 수 없다고 말한다.
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: seonbi-rca
    arm: with-only
  - type: regex
    name: finds-installed-version
    pattern: '2\.1\.0'
  - type: llm
    name: changelog-does-not-apply
    criteria: The answer notices that the installed fastqueue version (2.1.0, from the lockfile/requirements) differs from the version in the changelog the user cites (2.4.0), and says the 2.4.0 changelog does not describe the installed version's behavior (it at most suggests the bug may exist in 2.1.0 and be fixed later). Agreeing that the library cannot be the cause fails.
