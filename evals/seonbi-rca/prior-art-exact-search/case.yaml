schema_version: "1.1"
name: seonbi-rca-prior-art-exact-search
description: 실제 같은 라이브러리 에러가 주어지면 id·호스트·시각을 뺀 불변 문자열로 웹 검색하고, 찾은 것을 단서로만 표시하는지 본다.
tags: [seonbi-rca]
execution:
  prompt: |
    nightly 배치에서 이 에러가 났어. 원인 분석해줘.
    2025-03-09T02:14:07Z ERROR job=export-7f3a91 host=batch-worker-04.corp.example
    sqlalchemy.exc.OperationalError: (psycopg2.OperationalError) SSL SYSCALL error: EOF detected
    [SQL: SELECT * FROM export_queue WHERE id = %(id_1)s] [parameters: {'id_1': 884213}]
  max_turns: 12
  allowed_tools: [WebSearch, Skill]
runs: 3
expected_outcome: |
  답은 원인을 이론화하기 전에 정규화한 에러 문자열(psycopg2 OperationalError SSL SYSCALL error EOF detected)을
  웹 검색하고, job id·호스트·타임스탬프·파라미터 값은 쿼리에서 뺀다. 찾은 결과는 단서(lead)로 표시하고 증거로 단정하지 않는다.
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: seonbi-rca
    arm: with-only
  - type: tool_used
    name: searched-web
    tool: WebSearch
  - type: llm
    name: query-is-normalized-invariant
    criteria: The web search query (visible in the transcript's WebSearch call) contains the invariant error text (for example "SSL SYSCALL error, EOF detected" with psycopg2/OperationalError) and does NOT contain the job id 7f3a91, the host batch-worker-04.corp.example, the timestamp, or the parameter value 884213.
  - type: llm
    name: results-labeled-as-leads
    criteria: The answer labels what the search found as leads / candidate explanations (for example "단서", "lead", "가설") and does not state a search result as the confirmed cause of this incident without a check against the user's own system.
