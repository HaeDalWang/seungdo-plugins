schema_version: "1.1"
name: katalk-format-basic
description: 관찰한 사실을 주면 코드블록 하나, 3줄 이내, ?? 되묻기 형식의 카톡을 쓰는지 본다.
tags: [katalk]
execution:
  prompt: |
    방금 확인한 사실이야. 고객 앱 로그에 14:02부터 orders-db:5432 connection timeout이 찍혀. RDS 보안그룹 인바운드에는 10.10.0.0/16만 있고, 어제 새로 만든 앱 서브넷은 10.30.0.0/16이야. 고객 담당자한테 카톡 뭐라고 보내?
  max_turns: 6
  allowed_tools: [Skill]
runs: 3
expected_outcome: |
  답은 복사해 보낼 코드블록 하나에 2~3줄로, 관찰한 사실을 먼저 말하고 "~인가요??"로 되묻는다.
  고객 리소스를 해설하지 않는다.
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: katalk
    arm: with-only
  - type: regex
    name: exactly-one-code-block
    pattern: '^(?![\s\S]*```[\s\S]*```[\s\S]*```)[\s\S]*```[^\n]*\n[\s\S]*?\n```'
  - type: regex
    name: at-most-3-lines-in-block
    pattern: '```[^\n]*\n(?:[ \t]*\n)*(?:[^\n`]*\S[^\n]*\n(?:[ \t]*\n)*){1,3}```'
  - type: regex
    name: double-question-mark
    pattern: '\?\?'
  - type: llm
    name: fact-first
    criteria: In the message inside the code block, the first line starts with what was actually observed (for example the connection timeout since 14:02, or the security group allowing only 10.10.0.0/16) before asking or proposing anything.
  - type: llm
    name: no-resource-lecture
    criteria: Judge ONLY the message inside the code block; ignore notes to the user outside it. The message does not lecture the customer about their own resources or give multi-sentence background (for example explaining how security groups or VPC CIDRs work). It states observations, asks an "is that right?" style question, and gives at most one short reason and one fix line.
